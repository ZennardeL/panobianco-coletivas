<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panobianco Coletivas • Check-in de Aulas</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#ea580c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Coletivas">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://panobianco-pdv-erp.vercel.app/favicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Principal -->
    <link rel="stylesheet" href="style.css?v=1.0.0">

    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Ponto de Montagem do App -->
    <div id="app-root">
        <div class="loading-spinner" style="margin-top: 40vh;">
            Carregando Panobianco Coletivas...
        </div>
    </div>

    <!-- Script Principal (ES Module) -->
    <script type="module" src="src/app.js?v=1.0.0"></script>

    <!-- Registro do Service Worker (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.log('SW registration note:', err);
                });
            });
        }
    </script>
</body>
</html>
